          description: OK
          schema:
            $ref: '#/definitions/resources.ResourceJSONResponseDTO'
        "400":
          description: invalid id
          schema:
            type: string
        "404":
          description: resource not found
          schema:
            type: string
        "500":
          description: internal error
          schema:
            type: string
      summary: Get a resource by ID
      tags:
      - resources
    put:
      consumes:
      - application/json
      description: Update an existing resource's information
      parameters:
      - description: Resource ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated resource object
        in: body
        name: resource
        required: true
        schema:
          $ref: '#/definitions/resources.UpdateResourceRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: invalid request
