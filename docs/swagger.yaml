host: localhost:9136
info:
  contact: {}
  description: Optimize and control processes based on templates.
  title: Tarmo API
  version: 2.2.0-dev
paths:
  /resources:
    get:
      description: Get a list of all resources in the collection
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/resources.ResourceJSONResponseDTO'
            type: array
        "500":
          description: internal error
          schema:
            type: string
      summary: List all resources
      tags:
      - resources
    post:
      consumes:
      - application/json
      description: Add a new resource to the collection
      parameters:
      - description: Resource object
        in: body
        name: resource
        required: true
        schema:
          $ref: '#/definitions/resources.CreateResourceRequestDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
        "400":
          description: invalid request
          schema:
            type: string
      summary: Create a new resource
      tags:
      - resources
  /resources/{id}:
    delete:
      description: Remove a resource from the collection
      parameters:
      - description: Resource ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: invalid id
          schema:
            type: string
        "404":
          description: resource not found
          schema:
            type: string
        "500":
          description: internal error
          schema:
            type: string
      summary: Delete a resource
      tags:
      - resources
    get:
      description: Get detailed information about a single resource
      parameters:
      - description: Resource ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
